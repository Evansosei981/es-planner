<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1838"/>
      <stop offset="50%" stop-color="#141424"/>
      <stop offset="100%" stop-color="#0B0B12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B82FD"/>
      <stop offset="50%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#5A36E8"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5BA"/>
      <stop offset="100%" stop-color="#00D4A1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C5CFC" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#7C5CFC" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Glowing background orb -->
  <circle cx="256" cy="230" r="140" fill="#7C5CFC" opacity="0.12" filter="blur(30px)"/>

  <!-- Main Academic Icon (Graduation Cap + Calendar Spine) -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap Diamond -->
    <path d="M 256 120 L 416 195 L 256 270 L 96 195 Z" fill="url(#accentGrad)"/>
    <!-- Cap Underbody -->
    <path d="M 156 225 L 156 295 C 156 345 356 345 356 295 L 356 225 L 256 270 Z" fill="#5A36E8" opacity="0.95"/>
    <!-- Tassel -->
    <path d="M 400 205 L 420 300 C 420 315 410 325 395 325" fill="none" stroke="url(#tealGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="395" cy="330" r="14" fill="#00D4A1"/>

    <!-- Open Book / Planner Spine at Bottom -->
    <path d="M 160 360 Q 256 390 352 360 L 352 400 Q 256 425 160 400 Z" fill="url(#tealGrad)" opacity="0.9"/>
    <!-- Planner Bookmark Ribbon -->
    <path d="M 246 370 L 266 370 L 266 425 L 256 415 L 246 425 Z" fill="#FF7A00"/>
  </g>
</svg>
